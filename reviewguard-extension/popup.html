<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  body{
    width:240px; padding:16px;
    background:#0a0f1a; color:#e8f0fe;
    font-family:'DM Sans',sans-serif; font-size:13px;
    margin:0;
  }
  .brand{ display:flex; align-items:center; gap:8px; margin-bottom:12px }
  .icon{
    width:28px; height:28px; background:linear-gradient(135deg,#1a2a4a,#0d1a30);
    border:1px solid #4f9cf9; border-radius:6px;
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .name{ font-weight:700; font-size:14px }
  .sub{ font-size:10px; color:#4f9cf9; font-family:'IBM Plex Mono',monospace }
  .status{
    background:#0d1420; border:1px solid #1e2d45; border-radius:8px;
    padding:10px 12px; font-size:11px; color:#8da4c4;
    font-family:'IBM Plex Mono',monospace;
    line-height:1.6;
  }
  .tip{ margin-top:10px; font-size:11px; color:#4d6080; line-height:1.5 }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="brand">
  <div class="icon">🛡</div>
  <div>
    <div class="name">ReviewGuard</div>
    <div class="sub">AI Code Analysis</div>
  </div>
</div>
<div class="status">
  ✅ Extension active<br>
  🔗 Backend: localhost:8000<br>
  ⚡ Model: Gemini 2.0 Flash
</div>
<div class="tip">
  Open any GitHub PR → Files tab to trigger automatic analysis.
</div>
</body>
</html>
